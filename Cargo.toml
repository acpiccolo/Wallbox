[package]
name = "abl-evcc"
version = "0.1.0"
edition = "2021"
description = "ABL EVCC2/3 wallbox protocol and commandline tool"

[lib]
name = "abl_evcc_lib"
path = "src/lib.rs"

[[bin]]
name = "abl-evcc"
path = "src/main.rs"

[dependencies]
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
