[package]
name = "abl-evcc"
version = "0.1.0"
edition = "2021"
description = "ABL EVCC2/3 wallbox protocol and commandline tool"

[lib]
name = "abl_evcc_lib"
path = "src/lib.rs"

[[bin]]
name = "abl-evcc"
path = "src/main.rs"
required-features = ["bin-dependencies"]

[features]
default = ["bin-dependencies"]
bin-dependencies = [
    "safe-client-sync",
    "safe-client-async",
    "tokio-rtu-sync",
    "tokio-tcp-sync",
    "tokio-rtu",
    "tokio-tcp",
    "serde",
    "dep:anyhow",
    "dep:paho-mqtt",
    "dep:serde_yaml",
    "dep:serde_json",
    "dep:rand",
    "dep:humantime",
    "dep:humantime-serde",
    "dep:log",
]
tokio-rtu-sync = ["tokio-modbus/rtu-sync", "dep:tokio-serial", "dep:paste"]
tokio-tcp-sync = [
    "tokio/net",
    "tokio-modbus/tcp-sync",
    "dep:paste",
]
tokio-rtu = ["tokio/time", "tokio-modbus/rtu", "dep:tokio-serial", "dep:paste"]
tokio-tcp = [
    "tokio/time",
    "tokio/net",
    "tokio-modbus/tcp",
    "dep:paste",
]
serde = ["dep:serde"]
safe-client-sync = []
safe-client-async = []

[dependencies]
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }
paste = { version = "1.0", optional = true }
log = { version = "0.4", optional = true }

tokio-modbus = { version = "0.17", default-features = false, optional = true }
tokio-serial = { version = "5.4", optional = true }
tokio = { version = "1", features = ["sync", "time", "net"], default-features = false, optional = true }

paho-mqtt = { version = "0.14", optional = true }
serde_yaml = { version = "0.9", optional = true }
serde_json = { version = "1.0", optional = true }
rand = { version = "0.10", optional = true }
humantime = { version = "2.4", optional = true }
humantime-serde = { version = "1.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
