[package]
name = "abl-evcc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/acpiccolo/ABL-EVCC-Wallbox"
description = "ABL eMH1 / eMH2 (EVCC2/3) wallbox Modbus ASCII communication tool and library"

[lib]
name = "abl_evcc_lib"
path = "src/lib.rs"

[[bin]]
name = "abl-evcc"
path = "src/main.rs"
required-features = ["bin-dependencies"]

[features]
default = ["bin-dependencies"]
bin-dependencies = [
    "serde",
    "tokio-sync",
    "clap/derive",
    "dep:clap-verbosity-flag",
    "dep:flexi_logger",
    "dep:humantime",
    "dep:paho-mqtt",
    "dep:serde_json",
    "dep:yaml_serde",
    "dep:rand",
    "dep:humantime-serde",
    "dep:ctrlc",
]
serde = ["dep:serde"]
tokio-sync = []
tokio-async = ["tokio/io-util", "tokio/net", "tokio/time"]

[dependencies]
thiserror = "2"
tokio-serial = "5"
anyhow = "1"
log = "0.4"
clap = { version = "4", optional = true }
clap-verbosity-flag = { version = "3", optional = true }
flexi_logger = { version = "0.31", optional = true }
humantime = { version = "2", optional = true }
paho-mqtt = { version = "0.14", optional = true }
serde_json = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
yaml_serde = { version = "0.10", optional = true }
rand = { version = "0.10", optional = true }
humantime-serde = { version = "1", optional = true }
ctrlc = { version = "3.4", optional = true }
tokio = { version = "1", features = ["sync"], default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
