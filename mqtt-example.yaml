# Sample MQTT Configuration for ABL eMH1 Wallbox
# Copy and modify this file to mqtt.yaml

# URI of the MQTT broker (Mandatory).
# Example: "tcp://localhost:1883" or "mqtts://secure-broker.com:8883"
uri: "tcp://localhost:1883"

# Username for MQTT broker authentication (optional).
# username: "your_username"

# Password for MQTT broker authentication (optional).
# password: "your_password"

# Base MQTT topic to publish measurements to.
# Defaults to "abl-evcc".
topic: "abl-evcc/garage/wallbox"

# MQTT Quality of Service (QoS) level for publishing messages.
# 0: At most once, 1: At least once, 2: Exactly once.
# Defaults to 0.
qos: 1

# Allow controlling the wallbox via incoming MQTT messages (Default: false).
# When set to true, the daemon subscribes to <topic>/set/# and accepts remote commands:
#   - <topic>/set/current : Current limit in Amperes per phase (e.g. "16", "0" to stop)
#   - <topic>/set/power   : Total 3-phase power in Watts (e.g. "11000", converted to Amperes at 3x230V)
#   - <topic>/set/enable  : "true"/"on" (enables at max_current) or "false"/"off" (disables charging)
#   - <topic>/set/wake_up : "true" (triggers CP wake-up sequence E0 -> A1)
#   - <topic>/set/reset   : "true" (restarts the EVCC2 charge controller)
allow_control: false

# Maximum charging current in Amperes per phase allowed to be configured via MQTT (Default: 1).
# Any higher current or power requested via MQTT will be capped at this limit.
# Also serves as the current used when <topic>/set/enable is activated via MQTT.
# IMPORTANT: This value is per phase (e.g. 16 means 16A per phase = 11kW total across 3 phases).
max_current: 1

# Client ID for the MQTT connection (optional).
# If not provided, a random ID will be generated by the client library.
# client_id: "abl-evcc-main"
